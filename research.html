<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Research and Publications</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 28px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      justify-items: center;
      margin-bottom: 30px;
    }

    .file-card {
      background: #222;
      border: 1px solid #444;
      border-radius: 10px;
      width: 100%;
      max-width: 300px;
      padding: 20px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .file-card:hover {
      background: #333;
    }

    .file-card img {
      width: 80px;
      margin-bottom: 10px;
    }

    .file-card p {
      font-size: 16px;
      color: #ddd;
    }

    .back-btn {
      background-color: #dc3545;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .back-btn:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Research and Publications</h1>

    <!-- Grid Layout for Research Items -->
    <div class="grid-container" id="fileContainer">
      <!-- Research folders will appear here -->
    </div>

    <!-- Back Button -->
    <button class="back-btn" onclick="goBack()">Back</button>
  </div>

  <script>
    // Research Items List
    const files = [
      {
        name: 'Research Letter of Recommendation',
        type: 'img',
        path: 'lor.png'
      },
      {
        name: 'Publication: SDE Workflow Guide',
        type: 'link',
        url: 'https://apatr1.medium.com/a-visual-stage-by-stage-guide-to-the-modern-sde-workflow-48ee76f8e195'
      },
      {
        name: 'Publication: DevOps in 2022 and 2025',
        type: 'link',
        url: 'https://apatr1.medium.com/from-automation-to-intelligence-devops-in-2022-and-2025-fbf2cc3dff2f'
      }
    ];

    const fileContainer = document.getElementById('fileContainer');

    files.forEach(file => {
      const card = document.createElement('div');
      card.className = 'file-card';

      // Action on click
      if (file.type === 'img') {
        card.onclick = () => viewFile(file.path, file.type);
      } else if (file.type === 'link') {
        card.onclick = () => window.open(file.url, '_blank');
      }

      card.innerHTML = `
        <img src="weather_app.png" alt="${file.name}" />
        <p>${file.name}</p>
      `;

      fileContainer.appendChild(card);
    });

    // Function to handle image viewing
    function viewFile(path, type) {
      if (type === 'img') {
        window.location.href = `view.html?img=${path}`;
      }
    }

    function goBack() {
      window.location.href = 'ai.html'; // Or replace with 'index.html' if needed
    }
  </script>
</body>
</html>
